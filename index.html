<style>
/* VOICE: 朝のカフェのテーブル。光るアクリル盤と木琴の音。迷わない、明るい対戦。

   PICTURE: 盤が画面の高さいっぱい。上に▼と浮かぶ次のチップ。
   COLOUR and TYPE: 木の茶と窓の光、みずいろ(#2cc3f2)とピンク(#ff5c9e)。太い丸ゴシック。
   LAYOUT: 左右の上に両プレイヤー（手番が色で光る）、左下「1手もどる」、右下「音」「最初から」、終了後は下中央に「もう一度あそぶ」。 */
:root{color-scheme:light;--ink:#2b231c;--ca:#0e9fe0;--cb:#f2347c;--card:rgba(255,255,255,.88);--line:rgba(40,25,10,.12)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3a2e24;color:var(--ink);font:700 16px/1.3 -apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;--t:max(10px,env(safe-area-inset-top));--r:max(12px,env(safe-area-inset-right));--bt:max(10px,env(safe-area-inset-bottom));--l:max(12px,env(safe-area-inset-left))}
body.rot #stage{transform:rotate(90deg) translateY(-100%);--t:10px;--r:max(12px,env(safe-area-inset-top));--bt:10px;--l:max(12px,env(safe-area-inset-bottom))}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}
.dot{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 28%,#fff 0 10%,color-mix(in srgb,var(--c) 45%,#fff) 26%,var(--c) 62%,color-mix(in srgb,var(--c) 75%,#000) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.ico{position:absolute;bottom:var(--bt);width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;opacity:.75;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s}
.ico:hover{opacity:1}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#restart{right:var(--r)}#snd{right:calc(var(--r) + 50px)}
.edge{position:absolute;top:0;bottom:0;width:26%;pointer-events:none;opacity:0;transition:opacity .6s}
#e0{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--ca) 42%,transparent),transparent)}
#e1{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--cb) 42%,transparent),transparent)}
body.t0 #e0,body.t1 #e1{opacity:1}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ico:active{transform:scale(.92)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5;background:rgba(20,14,8,.45)}
.ov[hidden]{display:none}
.card{width:min(380px,100%);padding:22px 20px 18px;border-radius:26px;background:#fffaf3;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{translate:0 24px;scale:.9;opacity:0}}
.big{width:72px;height:72px;margin:0 auto 6px}
.card h2{margin:0;font-size:34px;line-height:1.15;color:var(--c)}
.card p{margin:6px 0 16px;font-size:15px;color:#7b6a59}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:50px;border-radius:16px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.row .go{background:var(--c);border-color:transparent;color:#fff}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff}

#winOv{background:radial-gradient(55% 65% at 50% 48%,color-mix(in srgb,var(--c) 38%,transparent),rgba(12,9,6,.62));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .8s ease}

.vic{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}

.vic h2{margin:.12em 0 .08em;font:800 clamp(64px,19vh,140px)/1 "Shippori Mincho B1","Hiragino Mincho ProN",serif;letter-spacing:.08em;margin-right:-.08em;
 background:linear-gradient(105deg,#fff 0%,#fff 38%,color-mix(in srgb,var(--c) 30%,#fff) 46%,#fffbe6 50%,color-mix(in srgb,var(--c) 30%,#fff) 54%,#fff 62%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 80%,transparent)) drop-shadow(0 2px 6px rgba(0,0,0,.35));animation:reveal 1.2s cubic-bezier(.2,.8,.2,1) both,shine 3.2s 1s linear infinite}

.vic .acts button{min-height:48px;border-radius:999px;font:inherit;font-size:16px;cursor:pointer;padding:0 26px}
#again2{background:#fff;color:var(--ink);border:0;box-shadow:0 10px 30px -10px color-mix(in srgb,var(--c) 90%,transparent)}
#look{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}

@keyframes shine{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}

.gems{display:flex;gap:clamp(14px,4vw,34px);align-items:flex-end;margin-top:clamp(14px,4vh,26px);animation:up .8s .2s both}
.gem{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:#fff;font:inherit;font-size:15px;cursor:pointer;padding:6px 10px;border-radius:18px}
.gem i{position:relative;display:block;width:clamp(48px,12vh,70px);aspect-ratio:1;perspective:420px}
.gem i{transition:transform .25s}.gem:hover i{transform:translateY(-3px)}
#pickGL{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.gem.dim i::before{opacity:0}
#g0{--c:var(--ca)}#g1{--c:var(--cb)}
#gR{align-self:center;min-height:46px;padding:0 22px;border:1px solid rgba(255,255,255,.5);border-radius:999px;flex-direction:row;gap:8px}
#gR:hover{background:rgba(255,255,255,.12)}
@media (prefers-reduced-motion:reduce){.card,#winOv,#pickOv,.vic *{animation:none!important}}
</style>

<body>
<div id="stage">

  <button class="ico" id="restart" aria-label="最初から"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>

  <div class="ov" id="winOv" hidden>
    <div class="vic" id="winCard">
      <small id="winSub">FOUR IN A ROW</small>
      <h2 id="winTxt">勝利</h2>
      <div class="rule"></div>
      <div class="acts"><button id="again2">もう一度</button><button id="look">盤面を見る</button></div>

  </div>
  <div class="ov" id="pickOv" hidden>
    <div class="vic pick">
      <h2>どちらから？</h2>
      <div class="rule"></div>
      <div class="gems">
        <button class="gem spin" id="g0"><i></i>水色</button>
        <button class="gem" id="gR">✦ おまかせ</button>
        <button class="gem spin" id="g1"><i></i>ピンク</button>
      </div>
    </div>
  </div>
  <div class="ov" id="askOv" hidden>
    <div class="card" style="--c:var(--ink)">
      <h2 style="font-size:24px">最初からやり直しますか？</h2>
      <p>いまの盤はリセットされます</p>
      <div class="row"><button id="keep">つづける</button><button class="go" id="doRestart">やり直す</button></div>
    </div>
  </div>
</div>

<script>
setTimeout(() => { if (!window.__g4) document.getElementById('stage').insertAdjacentHTML('beforeend', '<div id="err">3Dを読み込めませんでした。再読み込みしてください。</div>'); }, 9000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
window.__g4 = true;
{
const $ = id => document.getElementById(id);

const NAMES = ['みずいろ', 'ピンク'], CSS = ['#0e9fe0', '#f2347c'], HEX = [0x0e9fe0, 0xf2347c];

try { const s = JSON.parse(localStorage.getItem('glass4f') || 'null'); if (s) muted = !!s.muted; } catch (e) {}

const stage = $('stage'), canvas = $('c');
let renderer;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 200);

/* 背景：朝のカフェ（ぼかした室内と窓の光） */
function roomCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');

{ const t = new THREE.CanvasTexture(roomCanvas()); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }

/* 映り込み：明るい窓と天井の光で、アクリルにつやを出す */
{

const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-4, 6, 10); scene.add(key);

/* 木のテーブル */
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#b06a34'; g.fillRect(0, 0, 1024, 512);

    const y0 = rnd() * 512, f = rnd() * .006 + .0015, amp = rnd() * 9 + 2, ph = rnd() * 6;
    g.strokeStyle = `rgba(${80 + rnd() * 40 | 0},${40 + rnd() * 20 | 0},18,${rnd() * .22 + .05})`;
    g.lineWidth = rnd() * 2.4 + .5; g.beginPath();

  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshPhysicalMaterial({map:t, roughness:.3, clearcoat:.7, clearcoatRoughness:.2}));

}

/* クロームの脚 */
{
  const chrome = new THREE.MeshStandardMaterial({color:0xe6e9ee, metalness:1, roughness:.12, envMapIntensity:1.4});
  const tube = (len, r) => new THREE.CylinderGeometry(r, r, len, 20);

const chips = new THREE.Group(); scene.add(chips);

/* 入れられる列：▼と浮かぶ次のチップ */

    g.scale.setScalar(el.offsetWidth / (CR * 2) * .98);
    const hl = btn.classList.contains('hl');
    if (hl !== u.hl) { u.hl = hl; u.target += Math.PI; }
    if (btn.classList.contains('spin') && !still) u.target += dt * .6;
    u.ang += (u.target - u.ang) * Math.min(1, dt * 9);
    u.inner.rotation.y = u.ang;
    u.mat.opacity += ((btn.classList.contains('dim') ? .3 : 1) - u.mat.opacity) * .15;
    u.mat.emissiveIntensity = hl ? .45 : .22;
  });
  pickR.render(pickScene, pickCam);
}
$('gR').onclick = () => { wakeAudio(); roll(); };
$('snd').onclick = () => { muted = !muted; wakeAudio(); save(); updateUI(); landSound(1); };
$('restart').onclick = () => { if (moves.length && !over) $('askOv').hidden = false; else replay(); };
$('keep').onclick = () => { $('askOv').hidden = true; };
$('doRestart').onclick = replay;
$('again2').onclick = replay;
$('look').onclick = () => { $('winOv').hidden = true; };

/* 描画 */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], t = Math.min(1, (now - a.t0) / a.dur);
    a.m.position.y = a.from + (a.to - a.from) * bounce(t);
    if (a.hit === 0 && t >= 1 / 2.75) { a.hit = 1; landSound(1); }
    else if (a.hit === 1 && t >= 2 / 2.75) { a.hit = 2; landSound(.22); }
    if (t >= 1) anims.splice(i, 1);
  }
  const pulse = .5 + .5 * Math.sin(now / 200);
  winMats.forEach(m => m.emissiveIntensity = .35 + pulse * .7);
  winChips.forEach(ch => { const t0 = ch.userData.pop; if (!t0) return; const t = (now - t0) / 1000; ch.scale.setScalar(1 + Math.max(0, .35 * Math.exp(-t * 6) * Math.cos(t * 18)) + pulse * .05); });
  if (winLine) { const t = Math.min(1, (now - winLine.userData.t0) / 350); winLine.scale.set(1, t, 1); winLine.userData.mats[0].opacity = .7 + pulse * .3; winLine.userData.mats[1].opacity = .12 + pulse * .15; }
  if (over && winner >= 0 && winChips.length && Math.random() < .5) drift(winner);
  const dt = Math.min(.05, (now - (loop.last || now)) / 1000); loop.last = now;
  animMarks(now, dt);
  stepSparks(dt, now);
  ghosts.forEach(g => { if (g.visible) g.position.y = PH + 1.0 + (still ? 0 : Math.sin(now / 320) * .07); });
  tris.forEach((t, c) => { t.position.y = PH + .36 + (c === sel && !still ? Math.sin(now / 250) * .05 : 0); });
  renderer.render(scene, camera);
  renderPick(dt);
  requestAnimationFrame(loop);
}
layout(); openPick();
requestAnimationFrame(loop);
}
