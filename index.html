<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e3cc">
<meta name="apple-mobile-web-app-title" content="4つ並べ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>4つ並べ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 朝のカフェのテーブル。光るアクリル盤と木琴の音。迷わない、明るい対戦。
   IDEA: 正面いっぱいに透明アクリルの四目並べ。クロームの脚、木のテーブル。
   PICTURE: 盤が画面の高さいっぱい。上に▼と浮かぶ次のチップ。
   COLOUR and TYPE: 木の茶と窓の光、みずいろ(#2cc3f2)とピンク(#ff5c9e)。太い丸ゴシック。
   LAYOUT: 左右の上に両プレイヤー（手番が色で光る）、左下「1手もどる」、右下「音」「最初から」、終了後は下中央に「もう一度あそぶ」。 */
:root{color-scheme:light;--ink:#2b231c;--ca:#0e9fe0;--cb:#f2347c;--card:rgba(255,255,255,.88);--line:rgba(40,25,10,.12)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e3cc;color:var(--ink);font:700 16px/1.3 -apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;--t:max(10px,env(safe-area-inset-top));--r:max(12px,env(safe-area-inset-right));--bt:max(10px,env(safe-area-inset-bottom));--l:max(12px,env(safe-area-inset-left))}
body.rot #stage{transform:rotate(90deg) translateY(-100%);--t:10px;--r:max(12px,env(safe-area-inset-top));--bt:10px;--l:max(12px,env(safe-area-inset-bottom))}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}
.dot{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 28%,#fff 0 10%,color-mix(in srgb,var(--c) 45%,#fff) 26%,var(--c) 62%,color-mix(in srgb,var(--c) 75%,#000) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.ico{position:absolute;bottom:var(--bt);width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;opacity:.75;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s}
.ico:hover{opacity:1}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#restart{right:var(--r)}#snd{right:calc(var(--r) + 50px)}
.edge{position:absolute;top:0;bottom:0;width:26%;pointer-events:none;opacity:0;transition:opacity .6s}
#e0{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--ca) 42%,transparent),transparent)}
#e1{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--cb) 42%,transparent),transparent)}
body.t0 #e0,body.t1 #e1{opacity:1}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ico:active{transform:scale(.92)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5;background:rgba(20,14,8,.45)}
.ov[hidden]{display:none}
.card{width:min(380px,100%);padding:22px 20px 18px;border-radius:26px;background:#fffaf3;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{translate:0 24px;scale:.9;opacity:0}}
.big{width:72px;height:72px;margin:0 auto 6px}
.card h2{margin:0;font-size:34px;line-height:1.15;color:var(--c)}
.card p{margin:6px 0 16px;font-size:15px;color:#7b6a59}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:50px;border-radius:16px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.row .go{background:var(--c);border-color:transparent;color:#fff}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff}

#winOv{background:radial-gradient(55% 65% at 50% 48%,color-mix(in srgb,var(--c) 38%,transparent),rgba(12,9,6,.62));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .8s ease}
@keyframes fade{from{opacity:0}}
.vic{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
.vic small{font:500 clamp(13px,2.6vh,16px)/1 "Shippori Mincho B1",serif;letter-spacing:.5em;margin-right:-.5em;opacity:.85;animation:up 1s .15s both}
.vic h2{margin:.12em 0 .08em;font:800 clamp(64px,19vh,140px)/1 "Shippori Mincho B1","Hiragino Mincho ProN",serif;letter-spacing:.08em;margin-right:-.08em;
 background:linear-gradient(105deg,#fff 0%,#fff 38%,color-mix(in srgb,var(--c) 30%,#fff) 46%,#fffbe6 50%,color-mix(in srgb,var(--c) 30%,#fff) 54%,#fff 62%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 80%,transparent)) drop-shadow(0 2px 6px rgba(0,0,0,.35));animation:reveal 1.2s cubic-bezier(.2,.8,.2,1) both,shine 3.2s 1s linear infinite}
.vic .rule{width:min(260px,50vw);height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.8;animation:grow 1.1s .3s both}
.vic .acts{display:flex;gap:14px;align-items:center;margin-top:clamp(16px,5vh,30px);animation:up .8s .6s both}
.vic .acts button{min-height:48px;border-radius:999px;font:inherit;font-size:16px;cursor:pointer;padding:0 26px}
#again2{background:#fff;color:var(--ink);border:0;box-shadow:0 10px 30px -10px color-mix(in srgb,var(--c) 90%,transparent)}
#look{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
@keyframes reveal{from{opacity:0;transform:scale(1.25);filter:blur(14px)}}
@keyframes shine{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
#pickOv{background:radial-gradient(60% 70% at 50% 50%,rgba(60,48,40,.35),rgba(12,9,6,.66));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .6s ease}
.pick h2{font-size:clamp(30px,8vh,52px);letter-spacing:.06em;margin-right:-.06em;animation:up .8s both;background:none;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
.gems{display:flex;gap:clamp(14px,4vw,34px);align-items:flex-end;margin-top:clamp(14px,4vh,26px);animation:up .8s .2s both}
.gem{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:#fff;font:inherit;font-size:15px;cursor:pointer;padding:6px 10px;border-radius:18px}
.gem i{position:relative;display:block;width:clamp(48px,12vh,70px);aspect-ratio:1;perspective:420px}
.gem i{transition:transform .25s}.gem:hover i{transform:translateY(-3px)}
#pickGL{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gem i::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);opacity:.6;transition:opacity .3s}
.gem:hover i::before,.gem.hl i::before{opacity:1}
.gem.dim i::before{opacity:0}
#g0{--c:var(--ca)}#g1{--c:var(--cb)}
#gR{align-self:center;min-height:46px;padding:0 22px;border:1px solid rgba(255,255,255,.5);border-radius:999px;flex-direction:row;gap:8px}
#gR:hover{background:rgba(255,255,255,.12)}
@media (prefers-reduced-motion:reduce){.card,#winOv,#pickOv,.vic *{animation:none!important}}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
 background:repeating-linear-gradient(-28deg,transparent 0 120px,rgba(255,255,255,.16) 120px 200px,transparent 200px 330px),radial-gradient(90% 90% at 50% 40%,#fff6e8,#f6dcc0 60%,#e2ad7a);transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:clamp(96px,22vmin,150px);height:auto;aspect-ratio:1;border-radius:22.5%;box-shadow:0 18px 40px -14px rgba(120,60,20,.55),0 0 0 1px rgba(255,255,255,.6);animation:sIn .9s cubic-bezier(.2,1.4,.4,1) both}
#splash p{margin:0;font:800 clamp(24px,5.5vmin,34px)/1 "Shippori Mincho B1","Hiragino Mincho ProN",serif;letter-spacing:.14em;margin-right:-.14em;color:#5a3a22;animation:sUp .9s .25s both}
#splash i{display:block;width:min(140px,30vmin);height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff 45%,#fff 55%,transparent) -140px 0/140px 100% no-repeat,rgba(90,58,34,.15);animation:sBar 1.2s .4s linear infinite}
@keyframes sIn{from{opacity:0;transform:scale(.7)}}
@keyframes sUp{from{opacity:0;transform:translateY(8px)}}
@keyframes sBar{to{background-position:140px 0,0 0}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
</head>

function sparkleBurst(pos, p, n) {
  for (let i = 0; i < n && sparks.length < MAXS; i++) {
    const a = Math.random() * Math.PI * 2, sp = .6 + Math.random() * 2.4, up = Math.random() * 1.6;
    sparks.push({x:pos.x, y:pos.y, z:ZF + PT + .15, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp + up, vz:Math.random() * 1.5,
      life:0, max:.9 + Math.random() * 1.3, size:.12 + Math.random() * .3, tw:Math.random() * 20, c:SPARK_COL[p][i % 3]});
  }
}
function drift(p) {
  if (sparks.length > MAXS - 10) return;
  const ch = winChips[Math.random() * winChips.length | 0];
  sparks.push({x:ch.position.x + (Math.random() - .5) * .8, y:ch.position.y + (Math.random() - .5) * .8, z:ZF + PT + .12, vx:(Math.random() - .5) * .2, vy:.25 + Math.random() * .4, vz:0,
    life:0, max:1.2 + Math.random() * 1.2, size:.1 + Math.random() * .22, tw:Math.random() * 20, c:SPARK_COL[p][Math.random() * 3 | 0]});
}
function stepSparks(dt, now) {
  let n = 0;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const q = sparks[i]; q.life += dt;
    if (q.life > q.max) { sparks.splice(i, 1); continue; }
    q.vx *= .97; q.vy = q.vy * .97 - .6 * dt; q.vz *= .97;
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
  }
  for (const q of sparks) {
    const k = q.life / q.max, tw = .55 + .45 * Math.sin(q.tw + now * .02);
    sPos[n * 3] = q.x; sPos[n * 3 + 1] = q.y; sPos[n * 3 + 2] = q.z;
    sCol[n * 3] = q.c.r; sCol[n * 3 + 1] = q.c.g; sCol[n * 3 + 2] = q.c.b;
    sSize[n] = q.size * (1 - k * .5); sAlpha[n] = Math.min(1, q.life * 8) * (1 - k) * tw; n++;
  }
  sGeo.setDrawRange(0, n);
  for (const k of ['position', 'col', 'size', 'alpha']) sGeo.attributes[k].needsUpdate = true;
}

/* 横向きレイアウト（縦持ちなら90度回して表示） */
let SW = 1, SH = 1, rot = false;
const target = new THREE.Vector3(0, (PH + 1.5 - .62) / 2, 0);
function layout() {
  rot = innerHeight > innerWidth;
  document.body.classList.toggle('rot', rot);
  SW = rot ? innerHeight : innerWidth; SH = rot ? innerWidth : innerHeight;
  stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
  renderer.setSize(SW, SH, false);
  const pr = Math.min(devicePixelRatio || 1, 2);
  camera.aspect = SW / SH; camera.updateProjectionMatrix();
  sMat.uniforms.uScale.value = SH * pr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, h = Math.atan(Math.tan(v) * camera.aspect);
  const halfH = (PH + 1.5 + .62) / 2, halfW = PW / 2 + .4;
  const d = Math.max(halfH / Math.tan(v) / .97, halfW / Math.tan(h) / .7);
  camera.position.set(0, target.y + d * .05, d); camera.lookAt(target);
  placeMarks();
  if (typeof sizePick === 'function') sizePick();
}
addEventListener('resize', layout);
const ro = new ResizeObserver(layout); ro.observe(document.documentElement);
const local = e => rot ? {x:e.clientY, y:innerWidth - e.clientX} : {x:e.clientX, y:e.clientY};

/* 操作：列のどこをタップしても、その列にチップが入る */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -(ZF + PT)), hitP = new THREE.Vector3();
function colAt(e) {
  const p = local(e);
  ndc.set(p.x / SW * 2 - 1, -p.y / SH * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return -1;
  const c = Math.round(hitP.x + (COLS - 1) / 2);
  return c >= 0 && c < COLS && Math.abs(hitP.x) < PW / 2 + .2 && hitP.y > -.7 && hitP.y < PH + 2 ? c : -1;
}
canvas.addEventListener('pointerdown', e => {
  wakeAudio();
  if (choosing) return;
  if (over) { if (winChips.length || winner < 0) { if ($('winOv').hidden && !pending) showWin(winner); } return; }
  const c = colAt(e);
  if (c >= 0 && heightOf(c) >= 0) { sel = c; drop(c); }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || over) return;
  const c = colAt(e); if (c >= 0 && c !== sel && heightOf(c) >= 0) { sel = c; updateUI(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
addEventListener('keydown', e => {
  if (over || choosing) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const d = e.key === 'ArrowLeft' ? -1 : 1; for (let c = sel + d; c >= 0 && c < COLS; c += d) if (heightOf(c) >= 0) { sel = c; break; } updateUI(); }
  else if (e.key === 'Enter' || e.key === 'ArrowDown') { wakeAudio(); drop(sel); }
  else { const n = +e.key; if (n >= 1 && n <= 7) { wakeAudio(); sel = n - 1; drop(n - 1); } }
});

const replay = () => openPick();
function decide(p) {
  if (rolling) return;
  wakeAudio();
  if (!muted && actx) { const t = actx.currentTime; bar(1047, t, .2); bar(1568, t + .1, .24); }
  $('g' + p).classList.add('hl'); $('g' + (1 - p)).classList.add('dim');
  rolling = true; setTimeout(() => { rolling = false; startWith(p); }, 520);
}
$('g0').onclick = () => decide(0);
$('g1').onclick = () => decide(1);

/* 選択画面のチップ：盤と同じ形の3Dチップを別の小さな3D画面で描く */
const pickCanvas = document.createElement('canvas'); pickCanvas.id = 'pickGL'; $('pickOv').appendChild(pickCanvas);
let pickR = null;
try { pickR = new THREE.WebGLRenderer({canvas:pickCanvas, antialias:true, alpha:true}); } catch (e) {}
const pickScene = new THREE.Scene(), pickCam = new THREE.PerspectiveCamera(20, 1, 1, 10000);
const pickChips = [];
if (pickR) {
  pickR.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  pickR.toneMapping = THREE.ACESFilmicToneMapping;
  const pm = new THREE.PMREMGenerator(pickR), es = new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), new THREE.ShaderMaterial({side:THREE.BackSide,
    vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 p;void main(){float h=p.y*.5+.5;gl_FragColor=vec4(mix(vec3(.25,.2,.17),vec3(.95,.9,.85),h),1.);}'})));
  const add = (x, y, z, w, h, k) => { const m = new THREE.MeshBasicMaterial(); m.color.setRGB(k, k, k * .95); const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); o.position.set(x, y, z); o.lookAt(0, 0, 0); es.add(o); };
  add(8, 6, 8, 3, 9, 9); add(-8, 7, 8, 2, 6, 5); add(0, 12, 4, 12, 1, 7);
  pickScene.environment = pm.fromScene(es, .02).texture; pm.dispose();
  pickScene.add(new THREE.HemisphereLight(0xffffff, 0x554433, 1.2));
  const dl = new THREE.DirectionalLight(0xfff2e0, 2.2); dl.position.set(-3, 5, 8); pickScene.add(dl);
  [0, 1].forEach(p => {
    const mat = new THREE.MeshPhysicalMaterial({color:HEX[p], roughness:.08, clearcoat:1, clearcoatRoughness:.03, specularIntensity:1, envMapIntensity:1.8, emissive:HEX[p], emissiveIntensity:.22, transparent:true});
    const g = new THREE.Group(), body = new THREE.Mesh(chipGeo, mat), sq = new THREE.Mesh(sqGeo, mat);
    sq.scale.set(1, 1, 1.9); sq.rotation.z = p ? .5 : .2;
    const inner = new THREE.Group(); inner.add(body, sq); inner.rotation.x = -.22; g.add(inner);
    g.userData = {inner, mat, ang:p * 1.3, target:p * 1.3, hl:false};
    pickScene.add(g); pickChips.push(g);
  });
}
function sizePick() {
  if (!pickR) return;
  pickR.setSize(SW, SH, false);
  pickCam.aspect = SW / SH; pickCam.position.set(0, 0, (SH / 2) / Math.tan(THREE.MathUtils.degToRad(pickCam.fov) / 2));
  pickCam.updateProjectionMatrix();
}
function renderPick(dt) {
  if (!pickR || $('pickOv').hidden) return;
  pickChips.forEach((g, p) => {
    const btn = $('g' + p), el = btn.querySelector('i'), r = el.getBoundingClientRect(), u = g.userData;
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, q = rot ? {x:cy, y:innerWidth - cx} : {x:cx, y:cy};
    g.position.set(q.x - SW / 2, SH / 2 - q.y, 0);
    g.scale.setScalar(el.offsetWidth / (CR * 2) * .98);
    const hl = btn.classList.contains('hl');
    if (hl !== u.hl) { u.hl = hl; u.target += Math.PI; }
    if (btn.classList.contains('spin') && !still) u.target += dt * .6;
    u.ang += (u.target - u.ang) * Math.min(1, dt * 9);
    u.inner.rotation.y = u.ang;
    u.mat.opacity += ((btn.classList.contains('dim') ? .3 : 1) - u.mat.opacity) * .15;
    u.mat.emissiveIntensity = hl ? .45 : .22;
  });
  pickR.render(pickScene, pickCam);
}
$('gR').onclick = () => { wakeAudio(); roll(); };
$('snd').onclick = () => { muted = !muted; wakeAudio(); save(); updateUI(); landSound(1); };
$('restart').onclick = () => { if (moves.length && !over) $('askOv').hidden = false; else replay(); };
$('keep').onclick = () => { $('askOv').hidden = true; };
$('doRestart').onclick = replay;
$('again2').onclick = replay;
$('look').onclick = () => { $('winOv').hidden = true; };

/* 描画 */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], t = Math.min(1, (now - a.t0) / a.dur);
    a.m.position.y = a.from + (a.to - a.from) * bounce(t);
    if (a.hit === 0 && t >= 1 / 2.75) { a.hit = 1; landSound(1); }
    else if (a.hit === 1 && t >= 2 / 2.75) { a.hit = 2; landSound(.22); }
    if (t >= 1) anims.splice(i, 1);
  }
  const pulse = .5 + .5 * Math.sin(now / 200);
  winMats.forEach(m => m.emissiveIntensity = .35 + pulse * .7);
  winChips.forEach(ch => { const t0 = ch.userData.pop; if (!t0) return; const t = (now - t0) / 1000; ch.scale.setScalar(1 + Math.max(0, .35 * Math.exp(-t * 6) * Math.cos(t * 18)) + pulse * .05); });
  if (winLine) { const t = Math.min(1, (now - winLine.userData.t0) / 350); winLine.scale.set(1, t, 1); winLine.userData.mats[0].opacity = .7 + pulse * .3; winLine.userData.mats[1].opacity = .12 + pulse * .15; }
  if (over && winner >= 0 && winChips.length && Math.random() < .5) drift(winner);
  const dt = Math.min(.05, (now - (loop.last || now)) / 1000); loop.last = now;
  animMarks(now, dt);
  stepSparks(dt, now);
  ghosts.forEach(g => { if (g.visible) g.position.y = PH + 1.0 + (still ? 0 : Math.sin(now / 320) * .07); });
  tris.forEach((t, c) => { t.position.y = PH + .36 + (c === sel && !still ? Math.sin(now / 250) * .05 : 0); });
  renderer.render(scene, camera);
  renderPick(dt);
  if (!loop.shown) { loop.shown = true; window.hideSplash(); }
  requestAnimationFrame(loop);
}
layout(); openPick();
requestAnimationFrame(loop);
}
